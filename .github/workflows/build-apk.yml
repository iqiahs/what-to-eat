name: 构建 APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.10.2
        run: |
          curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager: $SDKMGR"
            exit 1
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 确认签名密钥在仓库里
        run: |
          if [ ! -f keystore/release.p12 ]; then
            echo "::error::缺少 keystore/release.p12，构建中止"
            exit 1
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 校验签名并重命名
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          if ! "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -q "CN=Chishenme"; then
            echo "::error::APK 不是用发布密钥签名的，拒绝发布"
            exit 1
          fi
          cp "$APK" chishenme.apk
          ls -lh chishenme.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: chishenme-apk
          path: chishenme.apk

      - name: 发布到 Release（手机浏览器直接下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view apk-latest > /dev/null 2>&1; then
            gh release create apk-latest \
              --title "最新版 APK" \
              --notes "由 GitHub Actions 自动构建" \
              --latest \
              --target "$GITHUB_REF_NAME"
          fi
          gh release upload apk-latest chishenme.apk --clobber
