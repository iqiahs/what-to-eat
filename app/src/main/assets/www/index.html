<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F3F7F5">
<title>今天吃什么</title>
<link rel="stylesheet" href="app.css">
<script>
/* 尽早把配色贴上，避免首屏闪一下默认色（原生桥可用时优先读原生存储） */
(function () {
  var ok = ["celadon", "indigo", "clay", "apricot", "ink"];
  var bg = { celadon: "#F3F7F5", indigo: "#F4F6FA", clay: "#FBF6F2", apricot: "#FBF9F3", ink: "#16181A" };
  var id = "celadon";
  try {
    if (window.Native && window.Native.getSetting) id = window.Native.getSetting("theme") || "celadon";
    else id = localStorage.getItem("pref_theme") || "celadon";
  } catch (e) {}
  if (ok.indexOf(id) < 0) id = "celadon";
  document.documentElement.setAttribute("data-theme", id);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", bg[id]);
})();
</script>
</head>
<body>

<div id="banner" class="banner" hidden>
  <span id="bannerText"></span>
  <button id="bannerBtn" class="banner-btn">去更新</button>
</div>

<div id="toast" class="toast" hidden></div>

<header class="head">
  <h1>今天吃什么</h1>
  <p class="sub">是啊，吃什么</p>
</header>

<nav class="chips" id="chips"></nav>

<main class="main">
  <section class="card" id="card">
    <div class="placeholder" id="placeholder">
      <div class="ph-emoji">🍚</div>
      <div class="ph-text">别纠结了，点下面按钮<br>让命运帮你选一顿</div>
    </div>
    <div class="result" id="result" hidden>
      <div class="dish" id="dishName"></div>
      <div class="meta" id="dishMeta"></div>
    </div>
    <div class="tipmsg" id="tipMsg" hidden></div>
  </section>

  <button class="gen" id="genBtn">生成</button>
  <p class="hint" id="hint">共 <span id="poolCount">0</span> 道候选</p>
  <button class="manage-row" id="manageRow" hidden>＋ 添加 / 管理我的菜</button>
</main>

<footer class="foot">
  <button class="ghost" id="openSet">设置</button>
</footer>

<!-- 我的食堂 -->
<div class="sheet" id="mineSheet" hidden>
  <div class="sheet-head">
    <span>我的食堂</span>
    <button class="close" data-close="mineSheet">完成</button>
  </div>
  <div class="sheet-body">
    <div class="add-row">
      <input id="newDish" class="input" type="text" placeholder="输入菜名，例如：麻辣香锅" maxlength="20">
      <select id="newCat" class="input sel">
        <option value="正餐">正餐</option>
        <option value="早餐">早餐</option>
        <option value="夜宵">夜宵</option>
        <option value="小吃">小吃</option>
      </select>
      <button class="add" id="addBtn">添加</button>
    </div>
    <p class="add-tip">把食堂或餐馆里能点到的菜填进来，以后就抽自己的菜。</p>
    <ul class="list" id="mineList"></ul>
    <button class="danger" id="clearMine">清空我的食堂</button>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="setSheet" hidden>
  <div class="sheet-head">
    <span>设置</span>
    <button class="close" data-close="setSheet">完成</button>
  </div>
  <div class="sheet-body">
    <label class="label">界面配色</label>
    <div class="swatches" id="swatches"></div>

    <label class="label">震动强度</label>
    <div class="seg" id="vibSeg">
      <button data-v="0">关</button>
      <button data-v="1">轻</button>
      <button data-v="2">中</button>
      <button data-v="3">强</button>
    </div>

    <label class="label">提示音音量</label>
    <div class="seg" id="sndSeg">
      <button data-v="0">关</button>
      <button data-v="1">轻</button>
      <button data-v="2">中</button>
      <button data-v="3">强</button>
    </div>

    <div class="info" id="infoBox"></div>

    <button class="primary" id="checkBtn">立即检查网页更新</button>
    <button class="ghost2" id="diagBtn">测试更新源（热更新不生效时点这里）</button>
    <div class="info diag" id="diagBox" hidden></div>
    <button class="ghost2" id="apkBtn">下载最新版 App（APK）</button>
    <button class="ghost2" id="resetBtn">恢复内置版本</button>
  </div>
</div>

<div class="mask" id="mask" hidden></div>

<script src="app.js"></script>
</body>
</html>
