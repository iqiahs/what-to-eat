plugins {
    id 'com.android.application'
}

// 签名文件由 GitHub Actions 首次构建时自动生成并回写到仓库的 keystore/release.p12
// 只要这个文件存在，每次构建出来的 APK 签名就完全一致，可以直接覆盖安装升级
def keystoreFile = rootProject.file('keystore/release.p12')

android {
    namespace 'com.whattoeat.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.whattoeat.app"
        minSdk 26          // Android 8.0 及以上，覆盖目前几乎所有在用手机
        targetSdk 35       // 关键：目标版本必须足够新，否则安卓 14+ / 小米新系统会直接拒绝安装
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            // 故意不做兜底：密钥文件缺失时构建直接失败，
            // 免得悄悄用 debug 密钥签出一个「装不上/升不了级」的包
            storeFile keystoreFile
            storeType "PKCS12"
            storePassword "chishenme2026"
            keyAlias "chishenme"
            keyPassword "chishenme2026"
            // 安卓 8.0（本项目 minSdk）只认 v2 以上的签名，v1 是给安卓 6 以下的老系统用的。
            // 实测 AGP 8 在 minSdk>=24 时不会生成 v1，这里显式打开 v2/v3 即可
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        // 必须显式指定 UTF-8：否则在中文 Windows 上 javac 会按 GBK 读源码，
        // Java 里的中文提示语（Toast）会变成乱码
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
